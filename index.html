<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Calculator</title>
  <link rel="shortcut icon" href="./res/icon-512.png" />
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#020a15">
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <div class="main-container">
    <div id="historyElm"></div>
    <section id="calculator">
    <div class="gradient"></div>
    <div class="gradient"></div>
    <div class="gradient"></div>
    <div id="calculator-input-div">
      <p id="currentExpTxt">Current Expression</p>
      <div id="slider"></div>
      <input type="text" id="calculator-input" inputmode="none" onblur="this.focus()" autofocus="">
      <div id="result"></div>
        <button id="copy-btn">Copy</button>
    </div>
    <div id="button-container">
      <button id="change" class="func-btn" name="Inv"><p>Inv</p></button>
      <button id="rad-deg-btn" class="func-btn"><p>Deg</p></button>
      <button class="const-btn hide" id="phi-btn"><p>φ</p></button>
      <button class="func-btn" id="sqrt-btn" name="√"><p>√</p></button>
      <button class="func-btn hide" id="log-btn" name="log("><p>log</p></button>
      <button class="func-btn" id="factorial-btn" name="!"><p>!</p></button>
      <button class="func-btn hide" id="sinh-btn" name="sinh("><p>sinh</p></button>

      <button class="func-btn" id="sin-btn" name="sin("><p>sin<sup></sup></p></button>
      <button class="func-btn hide" id="asin-btn" name="asin("><p>sin<sup><span style="font-size:12px">–1</span></sup></p></button>
      <button class="func-btn" id="cos-btn" name="cos("><p>cos</p></button>
      <button class="func-btn hide" id="acos-btn" name="acos("><p>cos<sup><span style="font-size:12px">–1</span></sup></p></button>
      <button class="func-btn" id="tan-btn" name="tan("><p>tan</p></button>
      <button class="func-btn hide" id="atan-btn" name="atan("><p>tan<sup><span style="font-size:12px">–1</span></sup></p></button>
      <button class="const-btn" id="pi-btn"><p>π</p></button>
      <button class="func-btn hide" id="cosh-btn" name="cosh("><p>cosh</p></button>
      <button class="func-btn" id="exp-btn" name="exp("><p>e<sup>x</sup></p></button>
      <button class="func-btn hide" id="asinh-btn" name="asinh("><p>sinh<sup><span style="font-size:12px;">–1</span></sup></p></button>
      <button class="func-btn" id="ln-btn" name="ln("><p>ln</p></button>
      <button class="func-btn hide" id="acosh-btn" name="acosh("><p>cosh<sup><span style="font-size:12px;">–1</span></sup></p></button>
      <button class="func-btn" id="pow-btn" name="^"><p>^</p></button>
      <button class="func-btn hide" id="atanh-btn" name="atanh("><p>tanh<sup><span style="font-size:12px;">–1</span></sup></p></button>
      <button class="const-btn" id="e-btn"><p>e</p></button>
      <button class="func-btn hide" id="tanh-btn" name="tanh("><p>tanh</p></button>
      <button id="ac-btn"><p>AC</p></button>
      <button class="opt-btn"><p>( )</p></button>
      <button class="opt-btn"><p>%</p></button>
      <button class="opt-btn" id="divide-btn"><p>÷</p></button>
      <button class="num-btn"><p>7</p></button>
      <button class="num-btn"><p>8</p></button>
      <button class="num-btn"><p>9</p></button>
      <button class="opt-btn" id="multiply-btn"><p>×</p></button>
      <button class="num-btn"><p>4</p></button>
      <button class="num-btn"><p>5</p></button>
      <button class="num-btn"><p>6</p></button>
      <button class="opt-btn" id="sub-btn"><p>-</p></button>
      <button class="num-btn"><p>1</p></button>
      <button class="num-btn"><p>2</p></button>
      <button class="num-btn"><p>3</p></button>
      <button class="opt-btn" id="add-btn"><p>+</p></button>
      <button class="num-btn"><p>0</p></button>
      <button class="num-btn"><p>.</p></button>
      <button id="back-btn"><p>&#9003;</p></button>
      <button id="equal-btn"><p>=</p></button>
      <button id="pseudoBtn"></button>
    </div>
  </section>
  </div>

<script src="classes.js"></script>
  <script src="main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registered!'))
        .catch(err => console.log('Registration failed:', err));
      });
    }                       
  </script>
</body>
</html>
